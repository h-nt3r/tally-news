# ---------- Clips and posts (open platforms only) ----------
# Accounts and communities to follow. They are pulled by this program on each build, never by a reader's browser,
# shown newest first, and never ranked by likes or views. They are not outlets, so they never count toward the
# left / center / right numbers.
#   platform: bluesky | mastodon | reddit
#   handle:   bluesky "apnews.com"  |  mastodon "@user@instance.social" or "#tag@instance.social"  |  reddit "r/worldnews"
#   kind:     "video" (default: only posts with a video) or "all" (every post)
