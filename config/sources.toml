# Your source list. Edit freely — this is the whole "algorithm" for who you hear from.
#
# lean:   left | center | right        (my best judgment; check AllSides / Ground News and change it)
# type:   how the outlet is funded or owned, only where that is well documented (leave it out when unsure):
#         wire | public | state | nonprofit | commercial     (definitions: the Methods page)
# topic:  us | world | tech
# site:   the outlet's own homepage, shown on the Sources page (the feed address is shown beside it)
#
# A feed that fails to load is skipped, so a dead link never breaks the page.

[settings]
repo_url = "https://github.com/h-nt3r/tally-news"   # the footer links here; empty shows "not published yet"
license = "AGPL-3.0"                                 # shown in the footer, linked to LICENSE in the repo
base_url = "https://h-nt3r.github.io/tally-news-site/"        # where this site is hosted, e.g. "https://news.example.org/"; citations carry it. Leave empty until it is public
hours_back = 36          # only show items newer than this
max_per_feed = 40        # stops one chatty outlet from dominating
max_videos = 12
clips = false            # short clips and posts from social accounts. Off: they are engagement content, and this is a tool for reading the news. Set true to bring them back
clip_thumbnails = true   # keep a copy of each clip's preview frame on this site, so readers contact no outside server until they tap play
post_match = 0.2         # how closely a clip or post must resemble a story to be listed under it (0 to 1)
trend_match = 0.15       # how closely a Bluesky trend must match a story (0 to 1); lower = more matches, more mistakes
latest_days = 3         # how many days of headlines the Latest page lists and searches (each day adds about 200 KB to a data file the page loads)
merge_threshold = 0.78   # second pass that joins duplicate stories split by topic or wording (0 = off). Lower = joins less; above about 0.83 it starts joining stories that are only related
summaries = true         # a short "what happened" for each story, written on this computer by a small open model (llama.cpp + Qwen). Needs the files in tools/ (see README); with none installed the page just has no summaries
summary_model = "tools/Qwen3-4B-Q4_K_M.gguf"
summary_bin = "tools/llama/llama-completion"
summary_per_build = 3    # new summaries per run. A run is a build, or a summary job run if you use ./schedule.sh summaries-install. Results are cached, and a story keeps showing its previous summary while a new one is written. build.py --all-summaries does every missing one at once
summary_budget_s = 600   # also stop starting new summaries after this many seconds in one run
summary_timeout_s = 420  # give up on one summary after this long (about 1 minute on an idle old dual-core CPU, several when it is busy). A story that times out rests 10, 20, 40... minutes before its next try
summaries_in_build = false   # true: each build writes the missing summaries after publishing. false: only the summary job does (./schedule.sh summaries-install), so page builds stay short
summary_threads = 2
chat = true              # the Ask page: ask questions answered from today's stories by a small open model on this computer (needs ./chat.sh running and the files in tools/; see README). Only works on a copy running on your own computer
chat_model = "tools/Qwen3-4B-Q4_K_M.gguf"   # try tools/Qwen3-1.7B-Q4_K_M.gguf for about 2.5x faster answers that get the sides wrong more often
chat_server_bin = "tools/llama/llama-server"
chat_port = 8770         # the helper's port on this computer. The model runs on the next port up
chat_site_port = 8765    # the port this news site is served on; only pages from it may use the helper
chat_threads = 2
chat_idle_min = 10       # unload the model after this many quiet minutes, to give the memory back
breaking = true          # a "Breaking" section at the top for stories unfolding right now (rule on the Methods page)
breaking_max_age_h = 4   # first report no older than this many hours
breaking_min_outlets = 3 # outlets that must have it...
breaking_min_recent = 2  # ...with at least this many reporting in the last breaking_recent_min minutes
breaking_recent_min = 60
breaking_fresh_min = 45  # or: 2+ outlets within this many minutes of the first report
breaking_max = 4         # most stories shown there
blindspots = true         # a "Blindspots" section: stories only one side has covered (rule on the Methods page)
blindspot_min_outlets = 3 # outlets that must have it, all labelled the same side
blindspot_min_age_h = 3   # first report at least this old, so the other sides have had time
blindspot_max = 6         # most stories shown there
cluster_threshold = 0.78 # lower = stricter grouping of "same story" (0 to 1)

